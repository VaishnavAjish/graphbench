<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glowing Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Neon Edge Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular / Rounded Blue Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Inner Soft Radial Light -->
  <circle cx="256" cy="230" r="180" fill="#60a5fa" opacity="0.25" />

  <!-- Graph Network Structure -->
  <g filter="url(#neonGlow)" stroke="#a5f3fc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Connecting Edges -->
    <line x1="256" y1="120" x2="140" y2="190" />
    <line x1="256" y1="120" x2="372" y2="190" />
    <line x1="140" y1="190" x2="140" y2="330" />
    <line x1="372" y1="190" x2="372" y2="330" />
    <line x1="140" y1="330" x2="256" y2="400" />
    <line x1="372" y1="330" x2="256" y2="400" />
    
    <!-- Cross Interconnections -->
    <line x1="256" y1="120" x2="256" y2="260" stroke="#38bdf8" stroke-width="10" />
    <line x1="140" y1="190" x2="256" y2="260" stroke="#38bdf8" stroke-width="10" />
    <line x1="372" y1="190" x2="256" y2="260" stroke="#38bdf8" stroke-width="10" />
    <line x1="140" y1="330" x2="256" y2="260" stroke="#38bdf8" stroke-width="10" />
    <line x1="372" y1="330" x2="256" y2="260" stroke="#38bdf8" stroke-width="10" />
    <line x1="256" y1="400" x2="256" y2="260" stroke="#38bdf8" stroke-width="10" />

    <!-- Secondary outer diagonals -->
    <line x1="140" y1="190" x2="372" y2="330" stroke="#0ea5e9" stroke-width="8" stroke-dasharray="8 6" opacity="0.7" />
    <line x1="372" y1="190" x2="140" y2="330" stroke="#0ea5e9" stroke-width="8" stroke-dasharray="8 6" opacity="0.7" />
  </g>

  <!-- Glowing Graph Nodes (Vertices) -->
  <!-- Top Node -->
  <circle cx="256" cy="120" r="28" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="5" />
  <circle cx="256" cy="120" r="10" fill="#ffffff" />

  <!-- Top-Left Node -->
  <circle cx="140" cy="190" r="26" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="5" />
  <circle cx="140" cy="190" r="9" fill="#ffffff" />

  <!-- Top-Right Node -->
  <circle cx="372" cy="190" r="26" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="5" />
  <circle cx="372" cy="190" r="9" fill="#ffffff" />

  <!-- Center Hub Node -->
  <circle cx="256" cy="260" r="32" fill="#0891b2" stroke="#ffffff" stroke-width="6" />
  <circle cx="256" cy="260" r="14" fill="#a5f3fc" />

  <!-- Bottom-Left Node -->
  <circle cx="140" cy="330" r="26" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="5" />
  <circle cx="140" cy="330" r="9" fill="#ffffff" />

  <!-- Bottom-Right Node -->
  <circle cx="372" cy="330" r="26" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="5" />
  <circle cx="372" cy="330" r="9" fill="#ffffff" />

  <!-- Bottom Node -->
  <circle cx="256" cy="400" r="28" fill="url(#nodeGrad)" stroke="#ffffff" stroke-width="5" />
  <circle cx="256" cy="400" r="10" fill="#ffffff" />
</svg>
